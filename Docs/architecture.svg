<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" role="img" aria-labelledby="title description">
  <title id="title">BiLing system architecture</title>
  <desc id="description">The input-method process holds event routing, pinyin segmentation, the lexicon engine, and the encrypted user dictionary; a separate daemon owns Qwen and re-ranks asynchronously over generation-tagged XPC; both are managed by launchd.</desc>
  <style>
    .sans { font-family: -apple-system, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
    .ink { fill: #2A3038; }
    .muted { fill: #6E6F66; }
    .verm { fill: #C74A34; }
    .indigo { fill: #41628A; }
    .panel { fill: #FDFAF2; stroke: #DCD5C4; }
    .cell { fill: #F7F3E9; stroke: #DCD5C4; }
  </style>
  <rect width="1240" height="640" fill="#F7F3E9"/>
  <rect x="0.5" y="0.5" width="1239" height="639" fill="none" stroke="#DCD5C4"/>

  <text x="72" y="66" class="sans ink" font-size="26" font-weight="700">Two processes, one low-latency input path</text>
  <text x="72" y="94" class="sans muted" font-size="15">The lexicon answers synchronously; the model adds points asynchronously. Typing survives a crashed or sleeping model process.</text>

  <rect x="72" y="128" width="180" height="96" rx="12" class="panel"/>
  <text x="162" y="170" text-anchor="middle" class="sans ink" font-size="16" font-weight="600">Any app</text>
  <text x="162" y="194" text-anchor="middle" class="sans muted" font-size="13">Safari · WeChat · VS Code</text>

  <rect x="72" y="264" width="520" height="304" rx="14" class="panel"/>
  <text x="96" y="300" class="sans ink" font-size="17" font-weight="700">BiLing.app<tspan class="muted" font-size="13">  InputMethodKit process</tspan></text>

  <rect x="96" y="320" width="222" height="64" rx="10" class="cell"/>
  <text x="110" y="346" class="sans ink" font-size="14" font-weight="600">Key routing</text>
  <text x="110" y="366" class="sans muted" font-size="12">Digits · paging · Return escape</text>

  <rect x="342" y="320" width="222" height="64" rx="10" class="cell"/>
  <text x="356" y="346" class="sans ink" font-size="14" font-weight="600">Pinyin lattice</text>
  <text x="356" y="366" class="sans muted" font-size="12">Keeps xian / xi'an ambiguity</text>

  <rect x="96" y="400" width="222" height="64" rx="10" class="cell"/>
  <text x="110" y="426" class="sans ink" font-size="14" font-weight="600">Lexicon · 1.44M entries</text>
  <text x="110" y="446" class="sans muted" font-size="12">Exact words + sentence beams, &lt;5 ms</text>

  <rect x="342" y="400" width="222" height="64" rx="10" class="cell"/>
  <text x="356" y="426" class="sans ink" font-size="14" font-weight="600">User dictionary (encrypted)</text>
  <text x="356" y="446" class="sans muted" font-size="12">AES-GCM · key in Keychain</text>

  <rect x="96" y="480" width="468" height="64" rx="10" class="cell"/>
  <text x="110" y="506" class="sans ink" font-size="14" font-weight="600">Candidate panel (native NSPanel)</text>
  <text x="110" y="526" class="sans muted" font-size="12">Lexicon results show immediately; Qwen re-sorts in place; stale generations are dropped</text>

  <rect x="648" y="264" width="520" height="304" rx="14" class="panel"/>
  <text x="672" y="300" class="sans ink" font-size="17" font-weight="700">biling-engined<tspan class="muted" font-size="13">  model daemon (launchd)</tspan></text>

  <rect x="672" y="320" width="468" height="64" rx="10" class="cell"/>
  <text x="686" y="346" class="sans ink" font-size="14" font-weight="600">Qwen3-0.6B-Base · Q4_K_M · 373 MB</text>
  <text x="686" y="366" class="sans muted" font-size="12">llama.cpp + Metal · shared-prefix batch scoring · Accelerate-vectorized softmax</text>

  <rect x="672" y="400" width="222" height="64" rx="10" class="cell"/>
  <text x="686" y="426" class="sans ink" font-size="14" font-weight="600">KV prefix cache</text>
  <text x="686" y="446" class="sans muted" font-size="12">Only new context tokens decode</text>

  <rect x="918" y="400" width="222" height="64" rx="10" class="cell"/>
  <text x="932" y="426" class="sans ink" font-size="14" font-weight="600">Idle auto-unload</text>
  <text x="932" y="446" class="sans muted" font-size="12">Weights released after 10 min</text>

  <rect x="672" y="480" width="468" height="64" rx="10" class="cell"/>
  <text x="686" y="506" class="sans ink" font-size="14" font-weight="600">Connection validation</text>
  <text x="686" y="526" class="sans muted" font-size="12">Same user, known executable paths, valid code signature only</text>

  <g stroke="#6E6F66" stroke-width="2" fill="none">
    <path d="M162 224 L162 264"/>
    <path d="M592 380 C620 380 620 380 648 380" stroke-dasharray="6 5"/>
    <path d="M648 430 C620 430 620 430 592 430" stroke-dasharray="6 5"/>
  </g>
  <g fill="#6E6F66">
    <path d="M162 264 l-5 -9 h10 z"/>
    <path d="M648 380 l-9 -5 v10 z"/>
    <path d="M592 430 l9 -5 v10 z"/>
  </g>
  <text x="167" y="248" class="sans muted" font-size="12">keystrokes / committed text</text>
  <text x="620" y="366" text-anchor="middle" class="sans indigo" font-size="12">XPC request</text>
  <text x="620" y="452" text-anchor="middle" class="sans indigo" font-size="12">async scores</text>

  <text x="72" y="608" class="sans muted" font-size="13"><tspan class="verm" font-weight="600">Sync path</tspan> keystroke → candidates in &lt;5 ms, never waits for the model.  <tspan class="verm" font-weight="600">Async path</tspan> generation-tagged; a new keystroke cancels the old request.  <tspan class="verm" font-weight="600">Everywhere</tspan> no network entitlement.</text>
</svg>
