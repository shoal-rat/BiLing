<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" role="img" aria-labelledby="title description">
  <title id="title">笔灵系统架构</title>
  <desc id="description">输入法进程内含事件路由、拼音切分、词典引擎与加密用户词库；模型守护进程持有 Qwen，经带代次校验的 XPC 异步重排；两者都由 launchd 管理。</desc>
  <style>
    .sans { font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
    .ink { fill: #2A3038; }
    .muted { fill: #6E6F66; }
    .verm { fill: #C74A34; }
    .indigo { fill: #41628A; }
    .panel { fill: #FDFAF2; stroke: #DCD5C4; }
    .cell { fill: #F7F3E9; stroke: #DCD5C4; }
  </style>
  <rect width="1240" height="640" fill="#F7F3E9"/>
  <rect x="0.5" y="0.5" width="1239" height="639" fill="none" stroke="#DCD5C4"/>

  <text x="72" y="66" class="sans ink" font-size="26" font-weight="700">两个进程，一条低延迟输入链路</text>
  <text x="72" y="94" class="sans muted" font-size="15">词典同步答题，模型异步加分；模型进程崩溃或休眠时，打字不受影响</text>

  <!-- client app -->
  <rect x="72" y="128" width="180" height="96" rx="12" class="panel"/>
  <text x="162" y="170" text-anchor="middle" class="sans ink" font-size="16" font-weight="600">任意 App</text>
  <text x="162" y="194" text-anchor="middle" class="sans muted" font-size="13">Safari · 微信 · VS Code</text>

  <!-- IME process -->
  <rect x="72" y="264" width="520" height="304" rx="14" class="panel"/>
  <text x="96" y="300" class="sans ink" font-size="17" font-weight="700">BiLing.app<tspan class="muted" font-size="13">　InputMethodKit 输入法进程</tspan></text>

  <rect x="96" y="320" width="222" height="64" rx="10" class="cell"/>
  <text x="110" y="346" class="sans ink" font-size="14" font-weight="600">按键路由</text>
  <text x="110" y="366" class="sans muted" font-size="12">数字选词 · 翻页 · Return 回退</text>

  <rect x="342" y="320" width="222" height="64" rx="10" class="cell"/>
  <text x="356" y="346" class="sans ink" font-size="14" font-weight="600">拼音切分格</text>
  <text x="356" y="366" class="sans muted" font-size="12">保留 xian / xi'an 全部歧义</text>

  <rect x="96" y="400" width="222" height="64" rx="10" class="cell"/>
  <text x="110" y="426" class="sans ink" font-size="14" font-weight="600">词典引擎 · 144 万词</text>
  <text x="110" y="446" class="sans muted" font-size="12">精确词 + 句子束搜索，&lt;5 ms</text>

  <rect x="342" y="400" width="222" height="64" rx="10" class="cell"/>
  <text x="356" y="426" class="sans ink" font-size="14" font-weight="600">个人词库（加密）</text>
  <text x="356" y="446" class="sans muted" font-size="12">AES-GCM · 密钥在 Keychain</text>

  <rect x="96" y="480" width="468" height="64" rx="10" class="cell"/>
  <text x="110" y="506" class="sans ink" font-size="14" font-weight="600">候选窗（原生 NSPanel）</text>
  <text x="110" y="526" class="sans muted" font-size="12">词典结果立刻显示；Qwen 结果到达后原位重排，过期代次直接丢弃</text>

  <!-- engine daemon -->
  <rect x="648" y="264" width="520" height="304" rx="14" class="panel"/>
  <text x="672" y="300" class="sans ink" font-size="17" font-weight="700">biling-engined<tspan class="muted" font-size="13">　模型守护进程（launchd）</tspan></text>

  <rect x="672" y="320" width="468" height="64" rx="10" class="cell"/>
  <text x="686" y="346" class="sans ink" font-size="14" font-weight="600">Qwen3-0.6B-Base · Q4_K_M · 373 MB</text>
  <text x="686" y="366" class="sans muted" font-size="12">llama.cpp + Metal · 共享前缀批量打分 · Accelerate 向量化 softmax</text>

  <rect x="672" y="400" width="222" height="64" rx="10" class="cell"/>
  <text x="686" y="426" class="sans ink" font-size="14" font-weight="600">KV 前缀缓存</text>
  <text x="686" y="446" class="sans muted" font-size="12">上下文只解码新增部分</text>

  <rect x="918" y="400" width="222" height="64" rx="10" class="cell"/>
  <text x="932" y="426" class="sans ink" font-size="14" font-weight="600">空闲自动释放</text>
  <text x="932" y="446" class="sans muted" font-size="12">10 分钟不用即卸载模型</text>

  <rect x="672" y="480" width="468" height="64" rx="10" class="cell"/>
  <text x="686" y="506" class="sans ink" font-size="14" font-weight="600">连接校验</text>
  <text x="686" y="526" class="sans muted" font-size="12">仅接受同用户、已知路径且代码签名有效的进程</text>

  <!-- arrows -->
  <g stroke="#6E6F66" stroke-width="2" fill="none">
    <path d="M162 224 L162 264"/>
    <path d="M592 380 C620 380 620 380 648 380" stroke-dasharray="6 5"/>
    <path d="M648 430 C620 430 620 430 592 430" stroke-dasharray="6 5"/>
  </g>
  <g fill="#6E6F66">
    <path d="M162 264 l-5 -9 h10 z"/>
    <path d="M648 380 l-9 -5 v10 z"/>
    <path d="M592 430 l9 -5 v10 z"/>
  </g>
  <text x="167" y="248" class="sans muted" font-size="12">按键 / 上屏</text>
  <text x="620" y="366" text-anchor="middle" class="sans indigo" font-size="12">XPC 请求</text>
  <text x="620" y="452" text-anchor="middle" class="sans indigo" font-size="12">异步分数</text>

  <!-- footer -->
  <text x="72" y="608" class="sans muted" font-size="13"><tspan class="verm" font-weight="600">同步路径</tspan> 按键 → 候选 &lt;5 ms，永不等待模型　　<tspan class="verm" font-weight="600">异步路径</tspan> 带代次标记，新按键即取消旧请求　　<tspan class="verm" font-weight="600">全链路</tspan> 无网络权限</text>
</svg>
