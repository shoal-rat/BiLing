<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">笔灵——在 macOS 本地运行的 AI 拼音输入法</title>
  <desc id="description">深靛蓝色产品横幅：笔灵使用本地 Qwen 模型，把拼音转换为符合上下文的中文候选。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11152b"/>
      <stop offset="0.55" stop-color="#29265f"/>
      <stop offset="1" stop-color="#5a3fd0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b7c6ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#080a19" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1200" height="480" rx="36" fill="url(#background)"/>
  <circle cx="1030" cy="70" r="170" fill="#8c79ff" opacity="0.22" filter="url(#blur)"/>
  <circle cx="160" cy="440" r="140" fill="#4f7cff" opacity="0.18" filter="url(#blur)"/>
  <g transform="translate(70 66)">
    <rect width="82" height="82" rx="23" fill="#ffffff" opacity="0.12"/>
    <path d="M25 23v36M25 41h25M50 23v36M17 32h16M42 50h20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <text x="106" y="37" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="34" font-weight="750">笔灵 BiLing</text>
    <text x="106" y="69" fill="#cbd1ff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18" font-weight="520" letter-spacing="1.5">macOS 本地 AI 拼音输入法</text>
  </g>
  <text x="70" y="226" fill="#c7d1ff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="58" font-weight="780">理解上下文，</text>
  <text x="70" y="294" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="58" font-weight="780">跟上你的思考。</text>
  <text x="72" y="342" fill="#d4d8f4" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21">144 万词汇 · Qwen 本地推理 · 零网络 · 原生 InputMethodKit</text>
  <g transform="translate(662 356)" filter="url(#shadow)">
    <rect width="468" height="74" rx="22" fill="#f4f4f8" fill-opacity="0.94"/>
    <rect x="12" y="12" width="148" height="50" rx="15" fill="#6657eb"/>
    <text x="31" y="45" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="23" font-weight="700">1  吉林大学</text>
    <text x="179" y="45" fill="#20212a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="23" font-weight="560">2  吉林大雪</text>
    <circle cx="376" cy="37" r="5" fill="#38c975"/>
    <text x="386" y="42" fill="#2c9a5c" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="700">Qwen 138 ms</text>
  </g>
</svg>
