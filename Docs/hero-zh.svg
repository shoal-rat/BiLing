<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">笔灵 — 本地大模型拼音输入法</title>
  <desc id="description">输入 jilindaxuelajixuexiao，候选第一位是 吉林大学垃圾学校。词典先出结果，Qwen 在本机重排，全程离线。</desc>
  <style>
    .sans { font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
    .ink { fill: #2A3038; }
    .muted { fill: #6E6F66; }
    .verm { fill: #C74A34; }
    .indigo { fill: #41628A; }
  </style>
  <rect width="1200" height="480" fill="#F7F3E9"/>
  <rect x="0.5" y="0.5" width="1199" height="479" fill="none" stroke="#DCD5C4"/>

  <!-- seal -->
  <rect x="72" y="72" width="76" height="76" rx="8" fill="none" stroke="#C74A34" stroke-width="3"/>
  <text x="110" y="106" text-anchor="middle" class="sans verm" font-size="28" font-weight="700">笔</text>
  <text x="110" y="138" text-anchor="middle" class="sans verm" font-size="28" font-weight="700">灵</text>

  <text x="176" y="116" class="sans ink" font-size="44" font-weight="700">笔灵 BiLing</text>
  <text x="176" y="152" class="sans muted" font-size="19">跑在你 Mac 上的大模型拼音输入法 · 词典打底，Qwen 排序，不碰网络</text>

  <!-- candidate bar demo -->
  <text x="72" y="228" class="mono indigo" font-size="20">jilindaxuelajixuexiao<tspan class="muted">▏</tspan></text>

  <rect x="72" y="248" width="1056" height="64" rx="14" fill="#FDFAF2" stroke="#DCD5C4"/>
  <rect x="86" y="258" width="252" height="44" rx="9" fill="#41628A"/>
  <text x="100" y="287" class="sans" font-size="20" fill="#FDFAF2"><tspan font-weight="600">1</tspan>  吉林大学垃圾学校</text>
  <text x="360" y="287" class="sans ink" font-size="20"><tspan class="muted">2</tspan>  吉林大学辣鸡学校</text>
  <text x="618" y="287" class="sans ink" font-size="20"><tspan class="muted">3</tspan>  吉林大学</text>
  <text x="790" y="287" class="sans ink" font-size="20"><tspan class="muted">4</tspan>  垃圾</text>
  <text x="908" y="287" class="sans muted" font-size="14">1/3</text>
  <text x="952" y="287" class="sans" font-size="14" fill="#4A7A5A">Qwen · 21 ms</text>

  <!-- stat chips -->
  <g class="sans">
    <rect x="72" y="356" width="222" height="56" rx="12" fill="#FDFAF2" stroke="#DCD5C4"/>
    <text x="92" y="380" class="verm" font-size="15" font-weight="600">完全本地</text>
    <text x="92" y="400" class="muted" font-size="13">无网络权限，可验证</text>

    <rect x="310" y="356" width="222" height="56" rx="12" fill="#FDFAF2" stroke="#DCD5C4"/>
    <text x="330" y="380" class="verm" font-size="15" font-weight="600">144 万词汇</text>
    <text x="330" y="400" class="muted" font-size="13">词典 &lt;5 ms 先出候选</text>

    <rect x="548" y="356" width="222" height="56" rx="12" fill="#FDFAF2" stroke="#DCD5C4"/>
    <text x="568" y="380" class="verm" font-size="15" font-weight="600">看得见前文</text>
    <text x="568" y="400" class="muted" font-size="13">读光标前的真实文本重排</text>

    <rect x="786" y="356" width="222" height="56" rx="12" fill="#FDFAF2" stroke="#DCD5C4"/>
    <text x="806" y="380" class="verm" font-size="15" font-weight="600">44.2% top-1</text>
    <text x="806" y="400" class="muted" font-size="13">推导语料实测，非示例</text>
  </g>
</svg>
