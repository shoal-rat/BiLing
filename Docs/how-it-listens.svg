<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6577"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B6432F"/>
    </marker>
  </defs>
  <rect width="760" height="330" rx="16" fill="#F6F1E7"/>
  <!-- distant ridge -->
  <path d="M0,300 C120,250 200,270 300,240 C400,210 470,260 560,235 C650,212 710,240 760,228 L760,330 L0,330 Z" fill="#2F6577" opacity="0.07"/>

  <!-- keys -->
  <g>
    <rect x="22" y="128" width="96" height="64" rx="10" fill="#fff" stroke="#232629" stroke-opacity="0.15"/>
    <text x="70" y="156" text-anchor="middle" font-size="15" fill="#232629" font-weight="600">按键</text>
    <text x="70" y="177" text-anchor="middle" font-size="11" fill="#9A6D48" font-family="Menlo, monospace">jiaoshi</text>
  </g>
  <line x1="118" y1="160" x2="160" y2="160" stroke="#2F6577" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 弦 -->
  <g>
    <rect x="162" y="112" width="120" height="96" rx="10" fill="#fff" stroke="#2F6577" stroke-opacity="0.5"/>
    <text x="222" y="140" text-anchor="middle" font-size="17" fill="#232629" font-weight="700">弦</text>
    <text x="222" y="160" text-anchor="middle" font-size="10.5" fill="#232629" opacity="0.7">全拼 · 声母 · 半音节</text>
    <text x="222" y="176" text-anchor="middle" font-size="10.5" fill="#232629" opacity="0.7">走音（手误）</text>
    <line x1="176" y1="194" x2="268" y2="194" stroke="#2F6577" stroke-opacity="0.4"/>
  </g>

  <!-- to qinpu -->
  <path d="M282,140 C320,100 330,74 368,74" fill="none" stroke="#2F6577" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- to ziqi -->
  <path d="M282,184 C320,222 330,238 368,238" fill="none" stroke="#2F6577" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 琴谱 -->
  <g>
    <rect x="370" y="40" width="170" height="70" rx="10" fill="#fff" stroke="#3E8A6E" stroke-opacity="0.6"/>
    <text x="455" y="66" text-anchor="middle" font-size="16" fill="#232629" font-weight="700">琴谱</text>
    <text x="455" y="86" text-anchor="middle" font-size="10.5" fill="#232629" opacity="0.7">42 万词 · mmap trie · Viterbi</text>
    <text x="455" y="101" text-anchor="middle" font-size="10.5" fill="#3E8A6E">CPU · 几毫秒</text>
  </g>

  <!-- 子期 two ears -->
  <g>
    <rect x="370" y="168" width="170" height="140" rx="10" fill="#fff" stroke="#B6432F" stroke-opacity="0.55"/>
    <text x="455" y="192" text-anchor="middle" font-size="16" fill="#232629" font-weight="700">子期</text>
    <rect x="384" y="204" width="68" height="50" rx="7" fill="#2F6577" fill-opacity="0.08"/>
    <text x="418" y="225" text-anchor="middle" font-size="13" fill="#232629" font-weight="600">听音</text>
    <text x="418" y="243" text-anchor="middle" font-size="9.5" fill="#232629" opacity="0.7">看得见按键</text>
    <rect x="458" y="204" width="68" height="50" rx="7" fill="#3E8A6E" fill-opacity="0.10"/>
    <text x="492" y="225" text-anchor="middle" font-size="13" fill="#232629" font-weight="600">知意</text>
    <text x="492" y="243" text-anchor="middle" font-size="9.5" fill="#232629" opacity="0.7">只看前文</text>
    <text x="455" y="275" text-anchor="middle" font-size="10.5" fill="#232629" opacity="0.75">两耳相乘 · 约束束搜索</text>
    <text x="455" y="292" text-anchor="middle" font-size="10.5" fill="#B6432F">GPU · 一个基座 + 81 MB 适配器</text>
  </g>

  <!-- rescue arrow qinpu -> ziqi -->
  <path d="M455,110 L455,166" fill="none" stroke="#B6432F" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#r)"/>
  <text x="463" y="142" font-size="10" fill="#B6432F">补漏</text>

  <!-- to composer -->
  <path d="M540,75 C580,75 590,128 616,140" fill="none" stroke="#2F6577" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M540,238 C580,238 590,192 616,180" fill="none" stroke="#2F6577" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- candidate strings -->
  <g>
    <rect x="618" y="122" width="122" height="76" rx="10" fill="#fff" stroke="#232629" stroke-opacity="0.15"/>
    <text x="679" y="147" text-anchor="middle" font-size="15" fill="#232629" font-weight="700">候选 · 弦</text>
    <circle cx="640" cy="170" r="7" fill="#B6432F"/>
    <text x="640" y="174" text-anchor="middle" font-size="9" fill="#fff">1</text>
    <text x="652" y="175" font-size="13" fill="#232629" font-weight="700">教室</text>
    <text x="690" y="175" font-size="11" fill="#9A6D48">2</text>
    <text x="699" y="175" font-size="13" fill="#232629" opacity="0.85">教师</text>
    <line x1="630" y1="186" x2="728" y2="186" stroke="#2F6577" stroke-opacity="0.35"/>
    <line x1="652" y1="186" x2="680" y2="186" stroke="#B6432F" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- 默契 -->
  <g>
    <rect x="626" y="232" width="106" height="44" rx="9" fill="#9A6D48" fill-opacity="0.10"/>
    <text x="679" y="252" text-anchor="middle" font-size="13" fill="#232629" font-weight="600">默契</text>
    <text x="679" y="268" text-anchor="middle" font-size="9.5" fill="#232629" opacity="0.7">本机加密的记忆</text>
  </g>
  <line x1="679" y1="232" x2="679" y2="200" stroke="#9A6D48" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- context -->
  <text x="22" y="276" font-size="12" fill="#232629" opacity="0.75">前文：</text>
  <text x="62" y="276" font-size="12" fill="#232629" font-weight="600">“走进”</text>
  <text x="22" y="294" font-size="10" fill="#9A6D48">两只耳朵都读前文</text>
  <path d="M106,272 C200,272 300,286 366,286" fill="none" stroke="#9A6D48" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#a)"/>
</svg>
